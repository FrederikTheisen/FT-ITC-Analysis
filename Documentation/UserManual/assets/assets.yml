  - file: experiment-merger-auto.png
    kind: screenshot
    alt: Experiment Merger showing three ordered tandem segments while Auto back-mixing scans possible transition corrections.
    caption: Auto back-mixing scans possible transition corrections for an ordered tandem experiment set.
