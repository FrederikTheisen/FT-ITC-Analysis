    publication_status: publish
  - file: experiment-designer-setup.png
    kind: screenshot
    alt: Experiment Designer Setup view showing the synthetic fit, instrument, concentrations, injection schedule, automatic volume, small first injection, tandem, and noise controls.
    caption: Setup defines the instrument, concentrations, injection schedule, tandem behavior, and simulation state.
